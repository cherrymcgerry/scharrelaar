version: 2

project_name: scharrelaar

builds:
  - id: scharrel
    main: ./cmd/scharrel
    binary: scharrel
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# The README's one-line installers download these from releases/latest/download/.
release:
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

changelog:
  disable: true
